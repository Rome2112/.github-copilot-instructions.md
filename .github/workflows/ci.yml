name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint Python
        run: ruff check .

      - name: Run test harness
        run: python test_harness.py

      - name: Run benchmark regression check
        run: python isomorphic_benchmark.py